
  # Perfil de testes do Cofre Digital Seguro

  spring:
    datasource:
      url: jdbc:h2:mem:securevault_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      driver-class-name: org.h2.Driver
      username: sa
      password:

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          jdbc:
            time_zone: UTC

    flyway:
      enabled: true
      locations: classpath:db/migration

    jackson:
      deserialization:
        fail-on-unknown-properties: true

    autoconfigure:
      exclude:
        - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  app:
    jwt:
      secret: test-only-jwt-secret-not-for-production-0123456789abcdef
      expiration-minutes: 60
      issuer: secure-vault

    crypto:
      key: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nLTEyMzQ=

    cookie:
      secure: false

    cors:
      allowed-origins: http://localhost:5173

    password:
      bcrypt-strength: 4

    login-attempts:
      max-failures: 5
      window-minutes: 15
      lock-minutes: 15

    request:
      max-body-bytes: 65536
  
