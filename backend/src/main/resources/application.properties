spring.application.name=secure-vault

# Carrega o .env da raiz do repositório
spring.config.import=optional:file:../.env[.properties]

# Evita usuário e senha padrão gerados pelo Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Banco de dados H2 em memória
spring.datasource.url=jdbc:h2:mem:securevault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=true

# Servidor
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=secure-vault

# Criptografia do cofre
app.crypto.key=${VAULT_ENCRYPTION_KEY}

# Cookies
app.cookie.secure=${COOKIE_SECURE:false}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Senhas
app.password.bcrypt-strength=12

# Tentativas de login
app.login-attempts.max-failures=5
app.login-attempts.window-minutes=15
app.login-attempts.lock-minutes=15

# Limite do corpo das requisições
app.request.max-body-bytes=65536
```